services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db_data:/data
    depends_on:
      - questions_service
      - notification_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/analytics')"]
      interval: 10s
      timeout: 3s
      retries: 5

  questions_service:
    build: ./backend/questions_service
    ports:
      - "8001:8001"
    volumes:
      - questions_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/tests')"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification_service:
    build: ./backend/notification_service
    ports:
      - "8002:8002"
    volumes:
      - notification_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  questions_data:
  notification_data:
